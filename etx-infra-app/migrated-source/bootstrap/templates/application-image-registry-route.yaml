apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: image-registry-route
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: image-registry-route
    app.kubernetes.io/part-of: etx-lab-platform
spec:
  project: default
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    path: etx-infra-app/migrated-source/workloads/image-registry-route
    helm:
      values: |
        enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-image-registry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
