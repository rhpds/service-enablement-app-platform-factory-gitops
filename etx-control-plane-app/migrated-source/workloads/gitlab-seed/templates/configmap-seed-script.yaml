apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-seed-script
  namespace: {{ .Values.gitlab.namespace | default "gitlab" }}
  labels:
    app.kubernetes.io/name: gitlab-seed-script
    app.kubernetes.io/part-of: etx-lab-platform
data:
  seed.sh: |
    #!/bin/bash
    set -e

    GITLAB_URL="{{ .Values.gitlab.url }}"
    GITLAB_TOKEN="${GITLAB_ROOT_TOKEN}"

    # Avoid interactive credential prompts in the Job pod
    export GIT_TERMINAL_PROMPT=0

    echo "==================================="
    echo "GitLab Repository Seeding"
    echo "==================================="
    echo "GitLab URL: $GITLAB_URL"
    echo ""

    # Function to create GitLab group
    create_group() {
      local group_name=$1
      local group_path=$2

      echo "Creating group: $group_name ($group_path)"

      curl -k -s -X POST "$GITLAB_URL/api/v4/groups" \
        --header "Authorization: Bearer $GITLAB_ACCESS_TOKEN" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"$group_name\",
          \"path\": \"$group_path\",
          \"visibility\": \"public\"
        }" | grep -q "id" && echo "✅ Group created: $group_path" || echo "⚠️  Group may already exist: $group_path"
    }

    # Function to create and seed repository
    seed_repository() {
      local repo_name=$1
      local source_url=$2
      local target_group=$3
      local visibility=$4
      local description=$5
      local clone_status

      echo ""
      echo "-----------------------------------"
      echo "Seeding: $repo_name"
      echo "Source: $source_url"
      echo "Target: $target_group/$repo_name"
      echo "-----------------------------------"

      # Create project in GitLab
      echo "Creating GitLab project..."

      # Get group ID
      GROUP_ID=$(curl -k -s "$GITLAB_URL/api/v4/groups/$target_group" \
        --header "Authorization: Bearer $GITLAB_ACCESS_TOKEN" | \
        grep -o '"id":[0-9]*' | head -1 | cut -d':' -f2)

      if [ -z "$GROUP_ID" ]; then
        echo "❌ Failed to get group ID for: $target_group"
        return 1
      fi

      # Create project
      PROJECT_RESPONSE=$(curl -k -s -X POST "$GITLAB_URL/api/v4/projects" \
        --header "Authorization: Bearer $GITLAB_ACCESS_TOKEN" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"$repo_name\",
          \"path\": \"$repo_name\",
          \"namespace_id\": $GROUP_ID,
          \"visibility\": \"$visibility\",
          \"description\": \"$description\",
          \"initialize_with_readme\": false
        }")

      if echo "$PROJECT_RESPONSE" | grep -q "id"; then
        echo "✅ Project created: $target_group/$repo_name"
      else
        echo "⚠️  Project may already exist: $target_group/$repo_name"
      fi

      # Mirror source repository (same approach as gitlab-etx-lab automation bootstrap)
      echo "Mirroring source repository..."
      TEMP_DIR="/tmp/$repo_name-$$"
      MIRROR_DIR="$TEMP_DIR/source.git"
      GITLAB_REPO_URL="${GITLAB_URL/https:\/\//https://oauth2:${GITLAB_ACCESS_TOKEN}@}/${target_group}/${repo_name}.git"

      echo "DEBUG: git binary: $(command -v git 2>/dev/null || echo 'not found')"
      echo "DEBUG: git version: $(git --version 2>&1 || echo 'unavailable')"
      echo "DEBUG: source_url=$source_url"
      echo "DEBUG: mirror_dir=$MIRROR_DIR"
      echo "DEBUG: target_repo=${GITLAB_URL}/${target_group}/${repo_name}.git"

      if ! command -v git >/dev/null 2>&1; then
        echo "❌ git is not installed in the seed container"
        return 1
      fi

      echo "DEBUG: running: git clone --mirror <source_url> $MIRROR_DIR"
      git -c credential.helper= clone --mirror "$source_url" "$MIRROR_DIR"
      clone_status=$?
      if [ "$clone_status" -ne 0 ]; then
        echo "❌ Failed to clone: $source_url"
        echo "DEBUG: clone exit code: $clone_status"
        echo "DEBUG: If this is a public repo, verify the cluster can reach github.com over HTTPS"
        ls -la "$TEMP_DIR" 2>/dev/null || echo "DEBUG: temp dir not created: $TEMP_DIR"
        return 1
      fi

      echo "DEBUG: mirror clone complete"
      ls -la "$MIRROR_DIR" 2>/dev/null || echo "DEBUG: mirror dir missing after clone"

      echo "Pushing mirrored repository to GitLab..."
      echo "DEBUG: running: git -C $MIRROR_DIR push --mirror <target_repo>"
      if ! git -C "$MIRROR_DIR" push --mirror "$GITLAB_REPO_URL"; then
        echo "❌ Failed to push to GitLab"
        echo "DEBUG: push exit code: $?"
        rm -rf "$TEMP_DIR"
        return 1
      fi

      rm -rf "$TEMP_DIR"
      echo "✅ Repository seeded: $target_group/$repo_name"
    }

    # Wait for GitLab to be fully ready
    echo "Waiting for GitLab API to be ready..."
    for i in {1..30}; do
      if curl -k -s -o /dev/null -w "%{http_code}" "$GITLAB_URL/api/v4/version" | grep -q "200\|401"; then
        echo "✅ GitLab API is ready"
        break
      fi
      echo "Waiting... ($i/30)"
      sleep 10
    done

    echo "Obtaining GitLab API access token..."
    TOKEN_RESPONSE=$(curl -k -s -X POST "$GITLAB_URL/oauth/token" \
      --data "grant_type=password&username=root&password=$GITLAB_TOKEN")
    GITLAB_ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | grep -o '"access_token":"[^"]*"' | head -1 | cut -d'"' -f4)

    if [ -z "$GITLAB_ACCESS_TOKEN" ]; then
      echo "❌ Failed to obtain GitLab API access token"
      exit 1
    fi
    echo "✅ GitLab API access token obtained"

    # Create groups
    {{- range .Values.repositories }}
    {{- if .targetGroup }}
    create_group "{{ .targetGroup }}" "{{ .targetGroup }}"
    {{- end }}
    {{- end }}

    sleep 5

    # Seed repositories
    {{- range .Values.repositories }}
    seed_repository \
      "{{ .name }}" \
      "{{ .sourceUrl }}" \
      "{{ .targetGroup }}" \
      "{{ .visibility }}" \
      "{{ .description }}"
    {{- end }}

    echo ""
    echo "==================================="
    echo "✅ GitLab Seeding Complete!"
    echo "==================================="
